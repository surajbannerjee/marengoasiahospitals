<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
    <defs>
      <linearGradient id="bgGrad_blog-brain" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0F172A"/>
        <stop offset="50%" stop-color="#1E293B"/>
        <stop offset="100%" stop-color="#003B73"/>
      </linearGradient>
      <radialGradient id="glow_blog-brain" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="600" height="400" fill="url(#bgGrad_blog-brain)"/>
    <circle cx="300" cy="180" r="140" fill="url(#glow_blog-brain)"/>
    <!-- Medical grid lines -->
    <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <line x1="0" y1="0" x2="600" y2="0" /><line x1="0" y1="50" x2="600" y2="50" /><line x1="0" y1="100" x2="600" y2="100" /><line x1="0" y1="150" x2="600" y2="150" /><line x1="0" y1="200" x2="600" y2="200" /><line x1="0" y1="250" x2="600" y2="250" /><line x1="0" y1="300" x2="600" y2="300" /><line x1="0" y1="350" x2="600" y2="350" />
      <line x1="0" y1="0" x2="0" y2="400" /><line x1="50" y1="0" x2="50" y2="400" /><line x1="100" y1="0" x2="100" y2="400" /><line x1="150" y1="0" x2="150" y2="400" /><line x1="200" y1="0" x2="200" y2="400" /><line x1="250" y1="0" x2="250" y2="400" /><line x1="300" y1="0" x2="300" y2="400" /><line x1="350" y1="0" x2="350" y2="400" /><line x1="400" y1="0" x2="400" y2="400" /><line x1="450" y1="0" x2="450" y2="400" /><line x1="500" y1="0" x2="500" y2="400" /><line x1="550" y1="0" x2="550" y2="400" />
    </g>
    <!-- ECG pulse line -->
    <path d="M 50 200 L 180 200 L 200 160 L 220 240 L 245 130 L 270 270 L 290 190 L 315 210 L 340 200 L 550 200" stroke="#8B5CF6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    
    <!-- Central Badge Motif -->
    <circle cx="300" cy="180" r="60" fill="#1E293B" stroke="#8B5CF6" stroke-width="3"/>
    <circle cx="300" cy="180" r="50" fill="rgba(255,255,255,0.05)"/>
    <text x="300" y="190" font-family="'Inter', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">CARE</text>
    
    <!-- Overlay Category Tag -->
    <rect x="40" y="320" width="130" height="34" rx="17" fill="#8B5CF6"/>
    <text x="105" y="342" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Neurology</text>
  </svg>